# XcodeGen project definition for TEE Log.
# Generate the .xcodeproj with: xcodegen generate
# (the .xcodeproj itself is git-ignored; this file is the source of truth)
name: TEELog

options:
  bundleIdPrefix: com.teelog
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "15.0"

packages:
  TEELogCore:
    path: .

targets:
  TEELog:
    type: application
    platform: iOS
    sources:
      - path: TEELog
        # Core files are compiled once, into the TEELogCore package (see
        # Package.swift). Excluded here so the app module gets them via
        # `import TEELogCore` — no duplicate/ambiguous types.
        excludes:
          - Models/Enums.swift
          - Models/Tracks.swift
          - Models/CaseRecord.swift
          - Engine/RequirementsEngine.swift
          - Engine/AutoCategorizer.swift
          - Engine/DictationMapper.swift
          - Engine/ExportService.swift
    dependencies:
      - package: TEELogCore
    info:
      path: TEELog/Info.plist
      properties:
        CFBundleDisplayName: TEE Log
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        # §10 privacy usage strings
        NSSpeechRecognitionUsageDescription: "Dictation turns your spoken findings into log entries, entirely on-device."
        NSMicrophoneUsageDescription: "Used only for dictation while you hold the mic button."
        NSFaceIDUsageDescription: "Unlock your case log."
    entitlements:
      path: TEELog/TEELog.entitlements
      properties: {}
    settings:
      base:
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES

  TEELogTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/TEELogCoreTests
    dependencies:
      - target: TEELog
      - package: TEELogCore
    settings:
      base:
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"

schemes:
  TEELog:
    build:
      targets:
        TEELog: all
        TEELogTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TEELogTests
