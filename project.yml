# XcodeGen project definition for TEE Log.
# Generate the .xcodeproj with: xcodegen generate
# (the .xcodeproj itself is git-ignored; this file is the source of truth)
name: TEELog

options:
  bundleIdPrefix: com.teelog
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "15.0"

packages:
  TEELogCore:
    path: .

targets:
  TEELog:
    type: application
    platform: iOS
    sources:
      - path: TEELog
        # Core files are compiled once, into the TEELogCore package (see
        # Package.swift). Excluded here so the app module gets them via
        # `import TEELogCore` — no duplicate/ambiguous types.
        excludes:
          - Models/Enums.swift
          - Models/Tracks.swift
          - Models/CaseRecord.swift
          - Engine/RequirementsEngine.swift
          - Engine/AutoCategorizer.swift
          - Engine/DictationMapper.swift
          - Engine/ExportService.swift
          - Engine/SpacedRepetition.swift
          - Engine/QuizCardGenerator.swift
    dependencies:
      - package: TEELogCore
      - target: TEEWidget   # widget extension embedded in the app (F1)
    info:
      path: TEELog/Info.plist
      properties:
        CFBundleDisplayName: TEE Log
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        # teelog:// scheme — widget tap-through to Quick Log (F1)
        CFBundleURLTypes:
          - CFBundleURLName: com.teelog.app
            CFBundleURLSchemes:
              - teelog
        # §10 privacy usage strings
        NSSpeechRecognitionUsageDescription: "Dictation turns your spoken findings into log entries, entirely on-device."
        NSMicrophoneUsageDescription: "Used only for dictation while you hold the mic button."
        NSFaceIDUsageDescription: "Unlock your case log."
    entitlements:
      path: TEELog/TEELog.entitlements
      properties:
        # F1: shared store + preferences between app, intents, and widget
        com.apple.security.application-groups:
          - group.com.teelog
    settings:
      base:
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES

  TEELogTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/TEELogCoreTests
    dependencies:
      - target: TEELog
      - package: TEELogCore
    settings:
      base:
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"

  # F1: WidgetKit extension — Lock Screen / Home Screen progress complication
  # ("247/300"), tap-through to Quick Log via teelog://quicklog. Reads the
  # shared App Group store (ModelContainerFactory), refreshed by
  # WidgetCenter.reloadAllTimelines() on every case save.
  TEEWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: TEEWidget
      - path: TEELog/Shared
      - path: TEELog/Models
        excludes:
          # Core files compile into TEELogCore; the widget gets the @Model
          # entities (CaseLog/ValveFinding/QuizCard) so it can open the
          # same SwiftData store (same pattern as the TEELog app target).
          - Enums.swift
          - Tracks.swift
          - CaseRecord.swift
    dependencies:
      - package: TEELogCore
    info:
      path: TEEWidget/Info.plist
      properties:
        CFBundleDisplayName: TEE Log Widget
        NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: TEEWidget/TEEWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.teelog
    settings:
      base:
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"

schemes:
  TEELog:
    build:
      targets:
        TEELog: all
        TEELogTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TEELogTests
